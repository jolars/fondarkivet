name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - src/fondarkivet/web/**
      - package.json
      - package-lock.json
      - wrangler.jsonc
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.PUBLISH_NAV == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
      url: https://fondarkivet.se/
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
      - name: Verify archive is seeded
        run: uv run --locked --no-dev fondarkivet-r2 status
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
