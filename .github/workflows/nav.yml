name: Refresh NAVs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nav-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
      - run: uv python install
      - name: Load archive
        if: vars.PUBLISH_NAV == 'true'
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --detach archive origin/data
          else
            git worktree add --detach archive HEAD
            git -C archive switch --orphan data
          fi
      - run: uv run --locked --no-dev fondarkivet archive site
      - name: Persist observations
        if: vars.PUBLISH_NAV == 'true'
        run: |
          git -C archive config user.name 'github-actions[bot]'
          git -C archive config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C archive add -- *.csv
          if ! git -C archive diff --cached --quiet; then
            git -C archive commit -m 'data: update fund NAVs'
            git -C archive push origin HEAD:refs/heads/data
          fi
      - uses: actions/upload-pages-artifact@v5
        if: vars.PUBLISH_NAV == 'true'
        with:
          path: site

  deploy:
    if: vars.PUBLISH_NAV == 'true'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: pages
