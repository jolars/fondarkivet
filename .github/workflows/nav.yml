name: Refresh NAVs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nav-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH_NAV: ${{ vars.PUBLISH_NAV == 'true' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
      - run: uv python install
      - name: Load archive
        if: env.PUBLISH_NAV == 'true'
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add --detach archive origin/data
          else
            git worktree add --detach archive HEAD
            git -C archive switch --orphan data
          fi
      - run: uv run --locked --no-dev fondarkivet archive site
      - name: Persist observations
        if: env.PUBLISH_NAV == 'true'
        run: |
          git -C archive config user.name 'github-actions[bot]'
          git -C archive config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C archive add -- *.csv
          if ! git -C archive diff --cached --quiet; then
            git -C archive commit -m 'data: update fund NAVs'
            git -C archive push origin HEAD:refs/heads/data
          fi
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH_NAV == 'true'
        with:
          name: nav-site
          path: site
          if-no-files-found: error

  deploy:
    if: vars.PUBLISH_NAV == 'true' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-workers
      url: https://fondarkivet.se/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: nav-site
          path: site
      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
