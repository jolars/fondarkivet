name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked python -m unittest discover -s tests
      - uses: jolars/panache-action@v1
      - run: uv build
      - name: Verify distributions
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            uv tool run --isolated --from "$distribution" fondarkivet --help
          done
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
