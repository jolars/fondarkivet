name: Refresh NAVs

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * 0'
  workflow_dispatch:

concurrency:
  group: nav-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PUBLISH_NAV: ${{ vars.PUBLISH_NAV == 'true' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
      - run: uv python install
      - name: Check collection without publishing
        if: env.PUBLISH_NAV != 'true' && github.event.schedule != '47 4 * * 0'
        run: uv run --locked --no-dev fondarkivet archive site
      - name: Update R2 archive
        if: env.PUBLISH_NAV == 'true' && github.event.schedule != '47 4 * * 0'
        run: uv run --locked --no-dev fondarkivet-r2 collect
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Prune retired archive objects
        if: env.PUBLISH_NAV == 'true' && github.event.schedule == '47 4 * * 0'
        run: uv run --locked --no-dev fondarkivet-r2 prune
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
